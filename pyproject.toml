[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-lab-trainer"
version = "0.2.1"
description = "ИИ-агент для генерации лабораторных работ по агентной разработке с автопроверкой и экспортом в Moodle/Gitverse"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "markdown>=3.5",
    "pydantic>=2.5",
    "httpx>=0.27",
    "pytest>=8.0",
    "langgraph>=1.0",
    "langchain-core>=1.0",
    "langchain-openai>=1.0",
    "langchain-anthropic>=1.0",
    "cryptography>=42",
    "itsdangerous>=2.1",
]

[project.scripts]
labgen = "labgen.cli:main"

[tool.setuptools.packages.find]
include = ["labgen*"]

[tool.setuptools.package-data]
labgen = ["runtime/*.py", "catalog/sources/*/*.py", "web/templates/*.html", "web/static/*", "web/static/vendor/codemirror/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: долгие тесты (прогон всего каталога)"]
