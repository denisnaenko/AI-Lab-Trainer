{% extends "base.html" %}
{% from "_macros.html" import logo_svg with context %}
{% block title %}Вход — AI Lab Trainer{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <div class="logo">{{ logo_svg(30) }}<span>AI Lab Trainer</span></div>
    {% if error %}<div class="alert">{{ error }}</div>{% endif %}
    <form method="post" action="/login">
      <input type="hidden" name="csrf" value="{{ csrf }}">
      <input type="hidden" name="next" value="{{ next }}">
      <label class="field"><span>Почта</span><input type="email" name="email" value="{{ form.email or '' }}" required autofocus autocomplete="email"></label>
      <label class="field"><span>Пароль</span><input type="password" name="password" required autocomplete="current-password"></label>
      <button class="btn brand lg block" type="submit">Войти</button>
    </form>
    <div class="switch">Нет аккаунта? <a href="/register">Зарегистрироваться</a></div>
  </div>
</div>
{% endblock %}
